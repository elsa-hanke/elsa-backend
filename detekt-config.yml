style:
  MaxLineLength:
    maxLineLength: 180
    excludes: ['**/build/generated/**']
  UtilityClassWithPublicConstructor:
    active: true
    excludes: [ '**/build/generated/**' ]
  UnusedImport:
    active: true
  UnusedVariable:
    active: true
  UnusedPrivateProperty:
    active: true
  UnusedPrivateFunction:
    active: true
  VarCouldBeVal:
    ignoreLateinitVar: true
  WildcardImport:
    active: false
  MagicNumber:
    active: false
  ReturnCount:
    active: false
  ThrowsCount:
    active: false
naming:
  ConstructorParameterNaming:
    active: false
  ClassNaming:
    active: true
    excludes: ['**/build/generated/**']
  ObjectPropertyNaming:
    active: true
    excludes: ['**/build/generated/**']
complexity:
  TooManyFunctions:
    allowedFunctionsPerClass: 20
    allowedFunctionsPerInterface: 16
  LongParameterList:
    allowedConstructorParameters: 17
    allowedFunctionParameters: 10
  ComplexCondition:
    allowedConditions: 5
  CyclomaticComplexMethod:
    allowedComplexity: 15
    excludes: ['**/build/generated/**']
  NestedBlockDepth:
    active: false
exceptions:
  SwallowedException:
    active: false
  TooGenericExceptionCaught:
    active: false
  TooGenericExceptionThrown:
    active: false
performance:
  SpreadOperator:
    active: false
