# ===================================================================
# Spring Boot configuration.
#
# This configuration is used for unit/integration tests.
#
# More information on profiles: https://www.jhipster.tech/profiles/
# More information on configuration properties: https://www.jhipster.tech/common-application-properties/
# ===================================================================

# ===================================================================
# Standard Spring Boot properties.
# Full reference is available at:
# http://docs.spring.io/spring-boot/docs/current/reference/html/common-application-properties.html
# ===================================================================

spring:
  http:
    converters:
      preferred-json-mapper: jackson2
  profiles:
    active: test
  application:
    name: elsaBackend
  datasource:
    type: com.zaxxer.hikari.HikariDataSource
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver
    # Share a temporary PostgreSQL database across Spring contexts in this test JVM.
    # Testcontainers removes it when the process exits; it is never an external DB.
    url: jdbc:tc:postgresql:16.9:///elsaBackend?TC_TMPFS=/testtmpfs:rw&TC_DAEMON=true
    username: elsaBackend
    password:
    hikari:
      # Cached Spring contexts each own a pool; keep their idle connections small.
      minimum-idle: 1
      maximum-pool-size: 5
      auto-commit: false
  jackson2:
    serialization:
      write-durations-as-timestamps: false
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
        implicit-strategy: org.springframework.boot.hibernate.SpringImplicitNamingStrategy
    properties:
      hibernate.connection.provider_disables_autocommit: true
      hibernate.cache.use_second_level_cache: false
      hibernate.cache.use_query_cache: false
      hibernate.generate_statistics: false
      hibernate.id.db_structure_naming_strategy: legacy
      org.hibernate.envers.audit_table_suffix: _audit
      org.hibernate.envers.revision_field_name: revision_id
      org.hibernate.envers.revision_type_field_name: revision_type
      org.hibernate.envers.revision_on_collection_change: false
      hibernate.jdbc.time_zone: UTC
      hibernate.timezone.default_storage: NORMALIZE
      hibernate.query.fail_on_pagination_over_collection_fetch: true
  liquibase:
    contexts: test
    change-log: classpath:/config/liquibase/test-master.xml
  mail:
    host: localhost
  main:
    allow-bean-definition-overriding: true
  messages:
    basename: i18n/messages
  task:
    execution:
      thread-name-prefix: elsa-backend-task-
      pool:
        core-size: 1
        max-size: 50
        queue-capacity: 10000
    scheduling:
      thread-name-prefix: elsa-backend-scheduling-
      pool:
        size: 1
  thymeleaf:
    mode: HTML
  mvc:
    problem-details:
      enabled: true
  cloud:
    aws:
      s3:
        enabled: false
      sns:
        enabled: false

application:
  arkistointi:
    tre:
      host: localhost
      user: test

server:
  port: 10344
  address: localhost

cloud:
  aws:
    region:
      static: eu-west-1
    stack:
      auto: false



# ===================================================================
# JHipster specific properties
#
# Full reference is available at: https://www.jhipster.tech/common-application-properties/
# ===================================================================

jhipster:
  clientApp:
    name: 'elsaBackendApp'
  logging:
    # To test json console appender
    use-json-format: false
  mail:
    from: test@localhost
    base-url: http://127.0.0.1:8080

