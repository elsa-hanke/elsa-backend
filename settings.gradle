pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    resolutionStrategy {
        eachPlugin {
            if (requested.id.id == "com.google.cloud.tools.jib") {
                useModule("com.google.cloud.tools:jib-gradle-plugin:${jibPluginVersion}")
            }
        }
    }
    plugins {
        id "org.springframework.boot" version "${springBootVersion}"
        id "com.google.cloud.tools.jib" version "${jibPluginVersion}"
        id "com.gorylenko.gradle-git-properties" version "${gitPropertiesPluginVersion}"
        id "org.sonarqube" version "${sonarqubePluginVersion}"
    }
}

rootProject.name = "elsa-backend"
