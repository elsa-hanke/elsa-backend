import com.adarshr.gradle.testlogger.theme.ThemeType

buildscript {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    dependencies {
        classpath "org.liquibase:liquibase-gradle-plugin:${liquibasePluginVersion}"
        classpath "org.liquibase:liquibase-core:5.0.3"
    }
}

plugins {
    id "org.jetbrains.kotlin.jvm" version "${kotlinVersion}"
    id "org.jetbrains.kotlin.kapt" version "${kotlinVersion}"
    id "org.jetbrains.kotlin.plugin.spring" version "${kotlinVersion}"
    id "org.jetbrains.kotlin.plugin.jpa" version "${kotlinVersion}"
    id "dev.detekt" version "${detektVersion}"
    id "jacoco"
    id "org.springframework.boot" version "${springBootVersion}"
    id "io.spring.dependency-management" version "1.1.7"
    id "com.adarshr.test-logger" version "4.0.0"
    id "com.google.cloud.tools.jib"
    id "com.gorylenko.gradle-git-properties"
    id "org.sonarqube"
    id "com.apollographql.apollo" version "${apolloVersion}"
    id "org.hibernate.orm" version "${hibernateVersion}"
    id "org.cyclonedx.bom" version "3.5.0"
    id("org.gradle.test-retry") version "1.6.6"
}

apply plugin: 'org.liquibase.gradle'

apollo {
    service("service") {
        packageName.set("fi.elsapalvelu.elsa")
    }
}

group = "fi.elsapalvelu.elsa"
version = "0.0.1-SNAPSHOT"

description = ""

apply from: "gradle/docker.gradle"
apply from: "gradle/sonar.gradle"
apply from: 'gradle/kotlin.gradle'

if (project.hasProperty("prod")) {
    apply from: "gradle/profile_prod.gradle"
} else {
    apply from: "gradle/profile_dev.gradle"
}

defaultTasks "bootRun"

springBoot {
    mainClass.set("fi.elsapalvelu.elsa.ElsaBackendApp")
}

ext {
    // Keep Kotlin runtime aligned with the compiler plugin.
    set('kotlin.version', kotlinVersion)
    // Security fixes newer than the Boot BOM; Jackson 2 remains for application/AWS compatibility.
    set('jackson-2-bom.version', '2.21.7')
    set('jackson-bom.version', '3.1.7')
    set('tomcat.version', '11.0.25')
}

dependencyManagement {
    imports {
        mavenBom "io.awspring.cloud:spring-cloud-aws-dependencies:${springCloudAwsVersion}"
    }
    dependencies {
        // Keep the crypto modules used by SAML and iText on the same release.
        dependency "org.bouncycastle:bcprov-jdk18on:1.86"
        dependency "org.bouncycastle:bcpkix-jdk18on:1.86"
        dependency "org.bouncycastle:bcutil-jdk18on:1.86"
    }
}

test {
    useJUnitPlatform {
        excludeTags 'external-integration'
    }
    exclude "**/*IT*", "**/*IntTest*"
    testLogging {
        events 'FAILED', 'SKIPPED'
    }
    reports.html.required = false
}

tasks.register('integrationTest', Test) {
    useJUnitPlatform {
        excludeTags 'external-integration'
    }
    description = "Execute integration tests."
    group = "verification"
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    include "**/*IT*", "**/*IntTest*"
    testLogging {
        events 'FAILED', 'SKIPPED'
    }
    reports.html.required = false
}

tasks.register('externalIntegrationTests', Test) {
    useJUnitPlatform {
        includeTags 'external-integration'
    }
    description = "Execute external integration tests."
    group = "verification"
    shouldRunAfter(test)
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    reports.html.required = false
    testlogger {
        theme = ThemeType.PLAIN
        showStandardStreams = true
    }
    retry {
        maxRetries = 2
        maxFailures = 5
        failOnPassedAfterRetry = false
    }
}

check.dependsOn integrationTest
check.dependsOn tasks.named("detekt")
check.dependsOn tasks.named("detektTest")
tasks.register('testReport', TestReport) {
    destinationDirectory = layout.buildDirectory.dir("reports/tests")
    testResults.from(test)
}

tasks.register('integrationTestReport', TestReport) {
    destinationDirectory = layout.buildDirectory.dir("reports/tests")
    testResults.from(integrationTest)
}

if (!project.hasProperty("runList")) {
    project.ext.runList = "main"
}

gitProperties {
    failOnNoGitDirectory = false
    keys = ["git.branch", "git.commit.id.abbrev", "git.commit.id.describe"]
}


configurations {
    providedRuntime
}

repositories {
    mavenLocal()
    mavenCentral()
    maven { url = "https://build.shibboleth.net/nexus/content/repositories/releases/" }
}

dependencies {
    implementation "tech.jhipster:jhipster-framework:${jhipsterDependenciesVersion}"
    implementation "com.fasterxml.jackson.module:jackson-module-kotlin"
    implementation "com.fasterxml.jackson.datatype:jackson-datatype-hibernate7"
    implementation "org.ehcache:ehcache"
    implementation "org.hibernate.orm:hibernate-jcache"
    implementation "org.hibernate.orm:hibernate-envers"
    implementation "org.springframework.boot:spring-boot-starter-mail"
    implementation "org.springframework.boot:spring-boot-starter-actuator"
    implementation "org.springframework.boot:spring-boot-starter-data-jpa"
    implementation "org.springframework.boot:spring-boot-starter-security"
    implementation "org.springframework.boot:spring-boot-starter-validation"
    implementation "org.springframework.boot:spring-boot-starter-webmvc"
    implementation "org.springframework.boot:spring-boot-jackson2"
    implementation "org.springframework.boot:spring-boot-starter-restclient"
    implementation "org.springframework.boot:spring-boot-starter-cache"
    implementation "org.springframework.boot:spring-boot-starter-liquibase"
    implementation "org.springframework.boot:spring-boot-starter-aspectj"
    implementation "org.springframework.boot:spring-boot-starter-thymeleaf"
    implementation "org.springframework.security:spring-security-saml2-service-provider"
    runtimeOnly "org.postgresql:postgresql"
    implementation "org.mapstruct:mapstruct:${mapstructVersion}"
    annotationProcessor "org.mapstruct:mapstruct-processor:${mapstructVersion}"
    annotationProcessor "org.hibernate.orm:hibernate-processor:${hibernateVersion}"
    annotationProcessor "org.springframework.boot:spring-boot-configuration-processor"
    testImplementation "org.springframework.boot:spring-boot-starter-webmvc-test"
    testImplementation "org.springframework.boot:spring-boot-starter-security-test"
    testImplementation "org.springframework.boot:spring-boot-starter-data-jpa-test"
    testImplementation "com.squareup.okhttp3:mockwebserver:${okhttpVersion}"
    testImplementation "org.testcontainers:testcontainers-jdbc"
    testImplementation "org.testcontainers:testcontainers-postgresql"
    implementation "org.jetbrains.kotlin:kotlin-reflect"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-slf4j"
    implementation 'io.awspring.cloud:spring-cloud-aws-starter'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-s3'
    implementation 'io.awspring.cloud:spring-cloud-aws-starter-sns'
    implementation 'io.micrometer:micrometer-registry-cloudwatch2'
    implementation "org.apache.commons:commons-text:1.15.0"
    implementation "net.coobird:thumbnailator:0.4.21"
    implementation "net.logstash.logback:logstash-logback-encoder:9.0"
    implementation "org.fluentd:fluent-logger:0.3.4"
    implementation "com.sndyuk:logback-more-appenders:1.8.6"
    implementation "com.apollographql.apollo:apollo-runtime:${apolloVersion}"
    implementation "com.squareup.okhttp3:okhttp-tls:${okhttpVersion}"
    implementation "net.javacrumbs.shedlock:shedlock-spring:4.33.0"
    implementation "net.javacrumbs.shedlock:shedlock-provider-jdbc-template:4.33.0"
    implementation "com.itextpdf:kernel:${itextVersion}"
    implementation "com.itextpdf:bouncy-castle-adapter:${itextVersion}"
    implementation "com.itextpdf:pdfa:${itextVersion}"
    implementation "com.itextpdf:html2pdf:5.0.5"
    implementation("org.apache.pdfbox:pdfbox:3.0.5")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher")
    implementation "org.springframework.integration:spring-integration-sftp"
    implementation("com.fasterxml.jackson.dataformat:jackson-dataformat-xml")
    implementation 'net.i2p.crypto:eddsa:0.3.0'
}


wrapper {
    gradleVersion = "9.8.1"
}

detekt {
    buildUponDefaultConfig = true
    allRules = false
    config.setFrom(files("$rootDir/detekt-config.yml"))
}

tasks.check {
    dependsOn(tasks.named("detektMain"))
}

testlogger {
    theme = ThemeType.STANDARD
    showExceptions = true
    showStackTraces = true
    showFullStackTraces = false
    showCauses = true
    slowThreshold = 2000
    showSummary = true
    showSimpleNames = false
    showPassed = true
    showSkipped = true
    showFailed = true
    showOnlySlow = false
    showStandardStreams = false
    showPassedStandardStreams = true
    showSkippedStandardStreams = true
    showFailedStandardStreams = true
    logLevel = LogLevel.LIFECYCLE
}

compileJava.dependsOn processResources
processResources.dependsOn bootBuildInfo
