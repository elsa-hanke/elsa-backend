name: E2E Tests

on:
  workflow_call:
    inputs:
      image-tag:
        description: Backend image tag to test against
        required: true
        type: string
      frontend-image-tag:
        description: Frontend image tag to test against
        required: false
        type: string
        default: 'latest'
  workflow_dispatch:
    inputs:
      image-tag:
        description: Backend image tag to test against
        required: true
        type: string
      frontend-image-tag:
        description: Frontend image tag to test against
        required: false
        type: string
        default: 'latest'

permissions:
  id-token: write
  contents: read

jobs:
  e2e:
    name: E2E shard ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: shared
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js for spec selection
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select Cypress specs and write summary
        id: select-specs
        env:
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_TOTAL: ${{ strategy.job-total }}
          E2E_RESULTS_DIR: e2e/results/shard-${{ matrix.shard }}
        run: |
          specs="$(node e2e/scripts/split-specs.mjs "$SHARD_INDEX" "$SHARD_TOTAL")"
          printf 'specs=%s\n' "$specs" >> "$GITHUB_OUTPUT"

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_ID }}:role/GithubActionsRole
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
        with:
          registries: "939452229770,654795471143"

      - name: Write secret files
        run: |
          printf '%s' "${{ secrets.SAML_PRIVATE_KEY }}" > /tmp/private.key
          printf '%s' "${{ secrets.SAML_PUBLIC_CRT }}"  > /tmp/public.crt
          printf '%s' "${{ secrets.HY_SISU_KEY }}"      > /tmp/hy-sisu.key
          printf '%s' "${{ secrets.HY_SISU_CRT }}"      > /tmp/hy-sisu.crt

      - name: Start services
        env:
          BACKEND_IMAGE_TAG: ${{ inputs.image-tag }}
          FRONTEND_IMAGE_TAG: ${{ inputs.frontend-image-tag }}
          APPLICATION_SECURITY_ENCODED_KEY: ${{ secrets.APPLICATION_SECURITY_ENCODED_KEY }}
          PRIVATE_KEY_FILE: /tmp/private.key
          PUBLIC_CRT_FILE: /tmp/public.crt
          HY_SISU_KEY_FILE: /tmp/hy-sisu.key
          HY_SISU_CRT_FILE: /tmp/hy-sisu.crt
        run: |
          echo "▶ Backend image tag: $BACKEND_IMAGE_TAG"
          docker compose -p elsa-e2e -f infra/docker-compose-cicd.yml up -d --wait --wait-timeout 300

      - name: Run Cypress e2e tests
        id: cypress
        env:
          CYPRESS_SPECS: ${{ steps.select-specs.outputs.specs }}
          E2E_RESULTS_DIR: /e2e/results/shard-${{ matrix.shard }}
        run: |
          docker run --rm \
            --network=host \
            --entrypoint /bin/sh \
            -e CYPRESS_SPECS \
            -e E2E_RESULTS_DIR \
            -v "${{ github.workspace }}/e2e:/e2e" \
            -w /e2e \
            cypress/included:16.1.1 \
            -c 'npm install && npx cypress run --browser chrome --config baseUrl=http://localhost:8080 --spec "$CYPRESS_SPECS"'

      - name: Upload Cypress results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: e2e/results/shard-${{ matrix.shard }}
          if-no-files-found: warn

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos-${{ matrix.shard }}
          path: e2e/cypress/videos

      - name: Dump container logs to files
        if: always()
        run: |
          mkdir -p e2e/container-logs
          for service in db elsa-backend elsa-frontend; do
            docker compose -p elsa-e2e -f infra/docker-compose-cicd.yml logs --no-color --timestamps "$service" > "e2e/container-logs/${service}.log" || true
          done

      - name: Upload container logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-container-logs-${{ matrix.shard }}
          path: e2e/container-logs


      - name: Upload screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.shard }}
          path: e2e/cypress/screenshots

      - name: Stop services
        if: always()
        run: docker compose -p elsa-e2e -f infra/docker-compose-cicd.yml down -v

  summary:
    name: E2E combined report
    needs: e2e
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Download shard results
        uses: actions/download-artifact@v4
        with:
          pattern: e2e-results-*
          path: e2e/shard-results

      - name: Generate combined report
        if: always()
        env:
          E2E_JOB_RESULT: ${{ needs.e2e.result }}
        run: node e2e/scripts/summarize-results.mjs e2e/shard-results e2e/combined-report

      - name: Upload combined report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-combined-report
          path: e2e/combined-report
