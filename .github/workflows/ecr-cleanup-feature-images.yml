name: ECR – Clean up untagged and branch images

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    name: Clean up ECR images while preserving releases and latest tags
    runs-on: ubuntu-latest
    environment: shared

    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.ACCOUNT_ID }}:role/GithubActionsRole
          aws-region: eu-west-1

      - name: Delete untagged and old branch images from ECR
        shell: bash
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
        run: |
          set -euo pipefail

          : "${ECR_REPOSITORY:?ECR_REPOSITORY must be set}"
          REPO_NAME="${ECR_REPOSITORY#*/}"
          echo "Repository: $REPO_NAME"

          select_image_ids() {
            jq -c '[
              .[] |
              (.tags // []) as $tags |
              select(
                # Protect the whole image if ANY tag is a release or latest tag.
                # All v* tags are protected, including versions such as v2.3.3-1.
                ($tags | any(
                  startswith("v") or
                  . == "main-latest" or
                  . == "release-latest" or
                  . == "feature-latest"
                ) | not)
                and
                (
                  ($tags | length == 0) or
                  ($tags | any(
                    startswith("feature-") or
                    startswith("main-") or
                    startswith("release-")
                  ))
                )
              ) |
              { imageDigest: .digest }
            ] | unique_by(.imageDigest)'
          }

          ALL_IMAGES=$(aws ecr describe-images \
            --repository-name "$REPO_NAME" \
            --filter tagStatus=ANY \
            --output json \
            --query 'imageDetails[*].{digest:imageDigest,tags:imageTags}')

          IMAGE_IDS=$(select_image_ids <<< "$ALL_IMAGES")
          echo "Cleanup candidates: $IMAGE_IDS"

          if [ "$IMAGE_IDS" = "[]" ]; then
            echo "No matching images found – nothing to delete."
            exit 0
          fi

          TOTAL=$(jq 'length' <<< "$IMAGE_IDS")
          echo "Total cleanup candidates: $TOTAL"

          OFFSET=0
          CHUNK_SIZE=100
          while [ "$OFFSET" -lt "$TOTAL" ]; do
            CHUNK=$(jq -c --argjson o "$OFFSET" --argjson c "$CHUNK_SIZE" \
              '.[$o:$o+$c]' <<< "$IMAGE_IDS")

            # Re-read tags immediately before deletion: a candidate may now be protected.
            # ECR does not support an atomic "delete only if still untagged" condition.
            CURRENT_IMAGES=$(aws ecr describe-images \
              --repository-name "$REPO_NAME" \
              --image-ids "$CHUNK" \
              --output json \
              --query 'imageDetails[*].{digest:imageDigest,tags:imageTags}')
            CURRENT_IMAGE_IDS=$(select_image_ids <<< "$CURRENT_IMAGES")

            if [ "$CURRENT_IMAGE_IDS" != "[]" ]; then
              echo "Deleting images: $CURRENT_IMAGE_IDS"
              RESULT=$(aws ecr batch-delete-image \
                --repository-name "$REPO_NAME" \
                --image-ids "$CURRENT_IMAGE_IDS" \
                --output json)
              echo "$RESULT"

              # ECR can report individual failures even when the CLI exits successfully.
              if ! jq -e '.failures == []' <<< "$RESULT" > /dev/null; then
                echo "ECR did not successfully delete every requested image." >&2
                exit 1
              fi
            else
              echo "Skipping batch: no images still qualify for cleanup."
            fi

            OFFSET=$((OFFSET + CHUNK_SIZE))
          done
